name: Deploy Feature to Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
      feature_branch:
        description: 'Feature branch to deploy'
        required: true
        type: string
      deployment_reason:
        description: 'Reason for deployment'
        required: true
        type: string

jobs:
  deploy-feature:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.feature_branch }}
          fetch-depth: 0

      - name: Get changes
        id: changes
        run: |
          git fetch origin ${{ github.event.inputs.environment }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.inputs.environment }}...HEAD || echo "")
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          CHANGE_COUNT=$(echo "$CHANGED_FILES" | grep -cve '^\s*$' || echo 0)
          echo "change_count=$CHANGE_COUNT" >> $GITHUB_OUTPUT

      - name: Create Deployment PR
        if: github.event.inputs.environment != 'dev'
        uses: actions/github-script@v7
        env:
          FEATURE_BRANCH: ${{ github.event.inputs.feature_branch }}
          TARGET_ENV: ${{ github.event.inputs.environment }}
          DEPLOYMENT_REASON: ${{ github.event.inputs.deployment_reason }}
          CHANGED_FILES: ${{ steps.changes.outputs.changed_files }}
          CHANGE_COUNT: ${{ steps.changes.outputs.change_count }}
        with:
          script: |
            const changedFiles = process.env.CHANGED_FILES
              ? process.env.CHANGED_FILES.split('\n').filter(Boolean)
              : [];
            const changeCount = process.env.CHANGE_COUNT || 0;
            const prBody = `## Feature Deployment to ${process.env.TARGET_ENV.toUpperCase()}
**Source Branch:** ${process.env.FEATURE_BRANCH}
**Target Environment:** ${process.env.TARGET_ENV.toUpperCase()}
**Deployment Reason:** ${process.env.DEPLOYMENT_REASON}

### Changes included (${changeCount} files):
\`\`\`
${changedFiles.join('\n')}
\`\`\`

**CODEOWNERS review required for deployment**`;

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 ${process.env.TARGET_ENV.toUpperCase()}: Deploy ${process.env.FEATURE_BRANCH}`,
              body: prBody,
              head: process.env.FEATURE_BRANCH,
              base: process.env.TARGET_ENV
            });

            console.log(`✅ Deployment PR created: ${pr.html_url}`);
            console.log(`👥 CODEOWNERS will be automatically assigned`);

      - name: Deploy directly to Dev
        if: github.event.inputs.environment == 'dev'
        run: |
          echo "🚀 Direct deployment to DEV environment"
          echo "📋 Changes: ${{ steps.changes.outputs.change_count }} files"
          # Add actual deployment commands here
